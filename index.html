<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AETHER — Weather Intelligence. Beyond the forecast. Experience the atmosphere." />
  <meta name="theme-color" content="#070b14" />
  <title>AETHER · Weather Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/aether.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body data-atmosphere="clear">
  <div class="app" id="app">

    <!-- Brand header -->
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
            <circle cx="16" cy="16" r="6" fill="currentColor"/>
            <path d="M16 2v4M16 26v4M2 16h4M26 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">AETHER</span>
          <span class="brand-tag">Weather Intelligence</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="geoBtn" title="My location" aria-label="Current location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☾</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search-box">
        <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search city orات مصر or any city..." autocomplete="off" />
        <button class="clear-btn hidden" id="clearBtn">×</button>
      </div>
      <div class="suggestions hidden" id="suggestions"></div>
    </div>

    <!-- Navigation -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="dash">Dashboard</button>
      <button class="nav-tab" data-view="egypt">Explore Egypt</button>
    </nav>

    <!-- ============ DASHBOARD ============ -->
    <div id="view-dash">
      <div class="location-strip" id="locStrip">
        <div class="loc-info">
          <span class="loc-dot"></span>
          <div>
            <div class="loc-name" id="cityName">—</div>
            <div class="loc-meta" id="locMeta">—</div>
          </div>
        </div>
        <button class="fav-toggle" id="favBtn" title="Favorite">☆</button>
      </div>

      <div class="chips" id="chips"></div>
      <div id="cacheBanner" class="cache-banner hidden" role="status"></div>

      <div id="loader" class="state hidden">
        <div class="spinner"></div>
        <p id="loadText">Fetching atmosphere data…</p>
        <p class="mono" id="loadCoords"></p>
      </div>

      <div id="error" class="state hidden">
        <div class="err-icon">⚠</div>
        <p id="errorText">Unable to retrieve weather</p>
        <p class="mono" id="errorLoc"></p>
        <button class="btn primary" id="retryBtn">Retry</button>
      </div>

      <main id="main" class="main hidden">
        <!-- Hero -->
        <section class="hero" id="hero">
          <div class="hero-glow"></div>
          <div class="hero-grid">
            <div class="hero-primary">
              <div class="temp-display" id="temp">—°</div>
              <div class="feels" id="feels">Feels —°</div>
              <div class="condition" id="desc">—</div>
            </div>
            <div class="hero-visual">
              <span class="weather-emoji" id="emoji">🌤</span>
            </div>
          </div>
          <div class="hero-footer" id="summary"></div>
        </section>

        <!-- Metrics -->
        <section class="metrics" id="metrics"></section>

        <!-- Hourly -->
        <section class="panel">
          <header class="panel-head"><h2>Hourly</h2></header>
          <div class="hourly-scroll" id="hourly"></div>
        </section>

        <!-- Chart -->
        <section class="panel">
          <header class="panel-head"><h2>Temperature trend</h2></header>
          <div class="chart-wrap"><canvas id="chart"></canvas></div>
        </section>

        <!-- 7-day -->
        <section class="panel">
          <header class="panel-head"><h2>7-day outlook</h2></header>
          <div class="forecast-list" id="days"></div>
        </section>

        <!-- Details + Sun -->
        <div class="split">
          <section class="panel">
            <header class="panel-head"><h2>Details</h2></header>
            <div class="detail-grid" id="details"></div>
          </section>
          <section class="panel">
            <header class="panel-head"><h2>Sun</h2></header>
            <div class="sun-row">
              <div class="sun-col"><span class="label">Rise</span><strong id="sunrise">—</strong></div>
              <div class="sun-track"><div class="sun-progress" id="sunFill"></div><div class="sun-knob" id="sunDot"></div></div>
              <div class="sun-col"><span class="label">Set</span><strong id="sunset">—</strong></div>
            </div>
          </section>
        </div>

        <!-- Insights -->
        <section class="panel">
          <header class="panel-head"><h2>Insights</h2></header>
          <div id="insights"></div>
        </section>
      </main>
    </div>

    <!-- ============ EXPLORE EGYPT ============ -->
    <div id="view-egypt" class="hidden">
      <div class="egypt-shell">
        <header class="egypt-head">
          <h2>Explore Egypt</h2>
          <p class="egypt-sub">27 governorates · real coordinates · live atmosphere</p>
          <input type="search" id="egyptFilter" class="egypt-search" placeholder="Filter governorates…" />
        </header>

        <div class="map-stage">
          <svg id="egyptSvg" viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="landGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="rgba(59,130,246,0.12)"/>
                <stop offset="100%" stop-color="rgba(99,102,241,0.06)"/>
              </linearGradient>
            </defs>
            <path class="egypt-outline" d="M80,40 L180,30 L220,50 L280,45 L320,80 L350,140 L360,220 L340,300 L320,360 L280,400 L220,430 L160,440 L100,420 L60,380 L40,320 L30,240 L40,160 L50,100 Z" fill="url(#landGrad)"/>
            <path class="nile-path" d="M200,50 Q195,120 200,200 Q205,280 200,350 Q195,400 200,440" fill="none"/>
            <g id="markers"></g>
          </svg>
        </div>

        <div class="gov-grid" id="govGrid"></div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay hidden" id="settingsOverlay">
    <div class="sheet" role="dialog" aria-labelledby="settingsTitle">
      <header class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" id="closeSettings">×</button>
      </header>
      <div class="sheet-body">
        <section class="setting-group">
          <h3>Appearance</h3>
          <label class="setting-label">Theme</label>
          <div class="segment" id="themeSeg">
            <button data-v="dark" class="active">Dark</button>
            <button data-v="light">Light</button>
            <button data-v="system">System</button>
          </div>
          <label class="setting-label">Language</label>
          <div class="segment" id="langSeg">
            <button data-v="ar" class="active">العربية</button>
            <button data-v="en">English</button>
          </div>
        </section>
        <section class="setting-group">
          <h3>Units</h3>
          <label class="setting-label">Temperature</label>
          <div class="segment" id="tempSeg">
            <button data-v="celsius" class="active">°C</button>
            <button data-v="fahrenheit">°F</button>
          </div>
          <label class="setting-label">Wind</label>
          <div class="segment" id="windSeg">
            <button data-v="kmh" class="active">km/h</button>
            <button data-v="mph">mph</button>
            <button data-v="ms">m/s</button>
          </div>
          <label class="setting-label">Time</label>
          <div class="segment" id="timeSeg">
            <button data-v="24" class="active">24h</button>
            <button data-v="12">12h</button>
          </div>
        </section>
        <section class="setting-group">
          <h3>Data</h3>
          <button class="btn ghost full" id="clearRecentBtn">Clear recent searches</button>
          <button class="btn ghost full" id="clearFavsBtn">Clear favorites</button>
          <button class="btn ghost full" id="exportBtn">Export settings</button>
          <button class="btn ghost full" id="importBtn">Import settings</button>
          <input type="file" id="importFile" accept=".json" class="hidden" />
          <button class="btn primary full" id="resetBtn">Reset all</button>
        </section>
      </div>
    </div>
  </div>

  <script src="js/aether.js"></script>
</body>
</html>
